name: Scripts CI

# Lints the shell and PowerShell scripts. Mirrors the local bar: shellcheck clean,
# PowerShell parses, and PSScriptAnalyzer is clean once repo-standard / false-positive
# rules are excluded (Write-Host is an intentional convention here).

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
  pull_request:
    paths:
      - "**.sh"
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          files=$(git ls-files '*.sh')
          echo "Checking: $files"
          shellcheck $files

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber

      - name: Parse check
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad = $true
              Write-Host "Parse errors in $($_.Name):"
              $errors | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($bad) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Write-Host is intentional for CLI output; the others are script-scope
          # false positives or match the existing repo style. The last two fire on the
          # best-effort empty catches and thread-job patterns in the detection/stress
          # scripts; left as-is for now and can be tightened later.
          $exclude = @(
            'PSAvoidUsingWriteHost',
            'PSUseSingularNouns',
            'PSReviewUnusedParameter',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSPossibleIncorrectUsageOfRedirectionOperator',
            'PSAvoidUsingEmptyCatchBlock',
            'PSUseUsingScopeModifierInNewRunspaces'
          )
          $results = Get-ChildItem scripts/*.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error -ExcludeRule $exclude
          }
          if ($results) {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200 | Write-Host
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer clean."
