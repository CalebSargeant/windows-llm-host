name: Release

# Semantic releases managed by Diatreme (https://github.com/MagmaMoose/diatreme).
# On merges to main it computes the next version from Conventional Commits, updates
# version.txt + CHANGELOG.md, tags vX.Y.Z, and publishes a GitHub Release.
# Versioning tool: release-please (release-type: simple) - see release-please-config.json.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # tags, GitHub Releases, and the release PR / version commits
  pull-requests: write   # release-please opens/updates the release PR
  id-token: write        # only used by auth-mode: public-app; harmless otherwise

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: magmamoose/diatreme@v1
        with:
          mode: release
          versioning-tool: release-please
          # App-free: use the workflow GITHUB_TOKEN for tags, releases, and the
          # release PR. Requires the repo setting "Allow GitHub Actions to create
          # and approve pull requests" (already enabled). To use the Diatreme
          # GitHub App instead (branch-protection bypass), set auth-mode: public-app
          # and keep id-token: write below.
          auth-mode: github-token
          environment: prod
          environments: '["prod"]'
          prerelease-identifiers: '{}'
          # No Docker image to promote (the proxy image is built locally), so image_name is omitted.
