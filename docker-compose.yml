name: windows-llm-host

services:
  ollama:
    image: ollama/ollama:latest
    container_name: windows-llm-host-ollama
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_LOAD_TIMEOUT: "${OLLAMA_LOAD_TIMEOUT:-30m}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - windows-llm-host-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./proxy
    image: windows-llm-host/proxy:local
    container_name: windows-llm-host-api
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      PORT: 8080
      UPSTREAM_BASE_URL: http://ollama:11434
      LLM_HOST_API_KEY: "${LLM_HOST_API_KEY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-0}"
      LOG_REQUESTS: "${LOG_REQUESTS:-true}"
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-11434}:8080"
    networks:
      - windows-llm-host-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 5s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: windows-llm-host-open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OLLAMA_API: "true"
      WEBUI_AUTH: "${WEBUI_AUTH:-false}"
      ENABLE_API_KEYS: "${ENABLE_API_KEYS:-false}"
      USER_PERMISSIONS_FEATURES_API_KEYS: "${USER_PERMISSIONS_FEATURES_API_KEYS:-false}"
      ENABLE_COMMUNITY_SHARING: "${ENABLE_COMMUNITY_SHARING:-false}"
      ENABLE_FOLLOW_UP_GENERATION: "${ENABLE_FOLLOW_UP_GENERATION:-false}"
      ENABLE_TAGS_GENERATION: "${ENABLE_TAGS_GENERATION:-false}"
      ENABLE_MEMORIES: "${ENABLE_MEMORIES:-false}"
      DEFAULT_MODELS: "${DEFAULT_MODEL:-qwen3-coder:30b}"
      DEFAULT_PINNED_MODELS: "${DEFAULT_PINNED_MODELS:-qwen3-coder:30b,qwen3:30b-instruct,qwen3:14b-q4_K_M,qwen2.5-coder:7b-instruct-q4_K_M,qwen3:4b-instruct}"
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    volumes:
      - webui_data:/app/backend/data
    networks:
      - windows-llm-host-net

networks:
  windows-llm-host-net:
    name: windows-llm-host-net

volumes:
  ollama_data:
  webui_data:
